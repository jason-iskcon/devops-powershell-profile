name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: Grammar, generator and PowerShell tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: k-aliases.ps1 is up to date
        run: python tools/generate_aliases.py --check
      # pwsh is preinstalled on GitHub's Ubuntu runners; tests that need it skip if it is missing.
      - name: Grammar and generator tests
        run: python -m unittest discover -s tests -p 'test_generate_aliases.py' -v
      - name: Test-Profile.ps1 (quiz regression)
        run: python -m unittest discover -s tests -p 'test_test_profile.py' -v

  posix:
    name: Bash and zsh (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install zsh, bash-completion and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y zsh bash-completion shellcheck
      - name: Install kubectl (checksum verified)
        run: |
          version=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      # The tests skip what is missing; make a missing tool a failure here instead.
      - name: Check the tools the tests need are present
        run: |
          for tool in bash zsh kubectl; do command -v "$tool"; done
          test -f /usr/share/bash-completion/bash_completion
      - name: Generated files are up to date
        run: python tools/generate_aliases.py --check
      - name: ShellCheck
        run: |
          shellcheck -s sh posix/install.sh
          shellcheck -s bash posix/k-aliases.sh posix/k-completion-data.sh posix/k-completion.bash posix/k-init.bash
      - name: Bash and zsh tests
        run: python -m unittest discover -s tests -p 'test_posix_*.py' -v

  windows-install-smoke:
    name: Installer and generated functions (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PowerShell modules the profile imports
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module posh-git, git-aliases, PSKubectlCompletion -Scope CurrentUser -Force
      # Installs into a temporary directory and never touches the runner's real profile.
      - name: Smoke test Install-Profile.ps1 and Test-Profile.ps1
        shell: pwsh
        run: ./tests/Smoke-Install.ps1
      # The normal full suite (Git and Terraform aliases included) against the real modules:
      # every documented alias must exist, so nothing unsupported may be expected.
      - name: Full Test-Profile.ps1 with the real modules
        shell: pwsh
        run: ./Test-Profile.ps1

  # The other Windows job uses PowerShell 7 (`shell: pwsh`). The profile has always said it supports
  # Windows PowerShell 5.1 too, which is a different executable with its own module folders.
  windows-powershell-5-1:
    name: Installer and profile under Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show the PowerShell version in use
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()
      - name: Install the PowerShell modules the profile imports
        shell: powershell
        run: |
          # Windows PowerShell 5.1 asks interactively to bootstrap the NuGet provider (which hangs in
          # CI), so install it explicitly and never prompt.
          $ProgressPreference = 'SilentlyContinue'
          $ConfirmPreference = 'None'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module posh-git, git-aliases, PSKubectlCompletion -Scope CurrentUser -Force -Confirm:$false
          Get-Module -ListAvailable posh-git, git-aliases, PSKubectlCompletion | Select-Object Name, Version
      - name: Smoke test Install-Profile.ps1 and Test-Profile.ps1
        shell: powershell
        run: ./tests/Smoke-Install.ps1
      - name: Full Test-Profile.ps1 with the real modules
        shell: powershell
        run: ./Test-Profile.ps1
