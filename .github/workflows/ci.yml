name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: Grammar, generator and PowerShell tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The PowerShell-dependent tests skip themselves when `pwsh` is missing. On this runner that must
      # be an error, not a quietly smaller test run.
      - name: Check that PowerShell 7 is present
        run: |
          command -v pwsh
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: k-aliases.ps1 is up to date
        run: python tools/generate_aliases.py --check
      - name: Grammar and generator tests
        run: python -m unittest discover -s tests -p 'test_generate_aliases.py' -v
      - name: Release metadata, script encoding and CI coverage tests
        run: |
          python -m unittest discover -s tests -p 'test_release_metadata.py' -v
          python -m unittest discover -s tests -p 'test_encoding.py' -v
          python -m unittest discover -s tests -p 'test_ci_coverage.py' -v
      - name: Test-Profile.ps1 tests (none may be skipped)
        # `shell: bash` runs `bash -eo pipefail`; the implicit shell has no pipefail, so `| tee` would hide a failing test run.
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_test_profile.py' -v 2>&1 | tee test-profile.log
          if grep -E '\.\.\. skipped|\(skipped=' test-profile.log; then
            echo "::error::PowerShell tests were skipped"; exit 1
          fi

  posix:
    name: Bash and zsh (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install zsh, bash-completion and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y zsh bash-completion shellcheck
      - name: Install kubectl (checksum verified)
        run: |
          version=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      # The tests skip what is missing; make a missing tool a failure here instead.
      - name: Check the tools the tests need are present
        run: |
          for tool in bash zsh kubectl; do command -v "$tool"; done
          test -f /usr/share/bash-completion/bash_completion
      - name: Generated files are up to date
        run: python tools/generate_aliases.py --check
      - name: ShellCheck
        run: |
          shellcheck -s sh posix/install.sh
          shellcheck -s bash posix/k-aliases.sh posix/k-completion-data.sh posix/k-completion.bash posix/k-init.bash
      - name: Bash and zsh tests (none may be skipped)
        # `shell: bash` runs `bash -eo pipefail`; the implicit shell has no pipefail, so `| tee` would hide a failing test run.
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_posix_*.py' -v 2>&1 | tee posix-tests.log
          if grep -E '\.\.\. skipped|\(skipped=' posix-tests.log; then
            echo "::error::Bash/zsh tests were skipped"; exit 1
          fi

  windows-install-smoke:
    name: Installer and generated functions (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PowerShell modules the profile imports
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module posh-git, git-aliases, PSKubectlCompletion -Scope CurrentUser -Force
      # Installs into a temporary directory and never touches the runner's real profile.
      - name: Smoke test Install-Profile.ps1 and Test-Profile.ps1
        shell: pwsh
        run: ./tests/Smoke-Install.ps1
      # The normal full suite (Git and Terraform aliases included) against the real modules:
      # every documented alias must exist, so nothing unsupported may be expected.
      - name: Full Test-Profile.ps1 with the real modules
        shell: pwsh
        run: ./Test-Profile.ps1

  # The other Windows job uses PowerShell 7 (`shell: pwsh`). The profile has always said it supports
  # Windows PowerShell 5.1 too, which is a different executable with its own module folders.
  # Installing the real modules from the PowerShell Gallery hung in this job (twice, even with the
  # NuGet provider installed first; cause not determined), so this job uses empty stand-in modules.
  # It therefore proves the profile, the installer and the generated functions work under 5.1, not
  # the third-party modules themselves.
  windows-powershell-5-1:
    name: Installer and profile under Windows PowerShell 5.1 (stand-in modules)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show the PowerShell version in use
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()
      - name: Create stand-in modules for the ones the profile imports
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'stand-in-modules'
          foreach ($name in 'posh-git', 'git-aliases', 'PSKubectlCompletion') {
              $dir = Join-Path $root $name
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
              $body = if ($name -eq 'PSKubectlCompletion') { 'function Register-KubectlCompletion {}' } else { '' }
              Set-Content -Path (Join-Path $dir "$name.psm1") -Value $body
          }
          "PSModulePath=$root;$env:PSModulePath" | Add-Content -Path $env:GITHUB_ENV
      - name: Smoke test Install-Profile.ps1 and Test-Profile.ps1 -KubectlOnly
        shell: powershell
        run: ./tests/Smoke-Install.ps1
